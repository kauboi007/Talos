services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - talos-net
  
  neo4j:
    image: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4j-data:/data
      - ./db/neo4j_schema.cql:/var/lib/neo4j/import/neo4j_schema.cql
    networks:
      - talos-net
  
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    networks:
      - talos-net

networks:
  talos-net:
    driver: bridge

volumes:
  neo4j-data:
  mongo-data: