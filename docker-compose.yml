services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - talos-net

  neo4j:
    image: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4j-data:/data
    networks:
      - talos-net
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    networks:
      - talos-net

  python_cbs:
    build:
      context: ./cbs_things
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CBS_REQUEST_STREAM=talos:cbs:requests
      - CBS_RESPONSE_STREAM=talos:cbs:responses
      - CBS_REDIS_TIMEOUT=10
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - talos-net
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request, json; response = json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)); exit(0 if response.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017
      MONGODB_DATABASE: ${MONGO_DB:-talos}
      CBS_SERVICE_URL: http://python_cbs:8001
      REDIS_HOST: redis
      CBS_REQUEST_STREAM: talos:cbs:requests
      CBS_RESPONSE_STREAM: talos:cbs:responses
      LOG_CHANNEL: stderr
    networks:
      - talos-net
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      python_cbs:
        condition: service_healthy

networks:
  talos-net:
    driver: bridge

volumes:
  neo4j-data:
  mongo-data:
