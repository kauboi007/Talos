services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - talos-net

  neo4j:
    image: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4j-data:/data
      # - ./db/neo4j_schema.cql:/var/lib/neo4j/import/neo4j_schema.cql
    networks:
      - talos-net
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    networks:
      - talos-net

  python_cbs:
    build:
      context: ./cbs_things
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASS}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - talos-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://python_cbs:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # server:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./web:/var/www/html
  #   networks:
  #     - talos-net
  #   environment:
  #     - DB_DSN=mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017
  #   depends_on:
  #     - mongo
  #     - redis

networks:
  talos-net:
    driver: bridge

volumes:
  neo4j-data:
  mongo-data:
